# DOSBox configuration for building vi-clone with LSI C-86.
# Headless build: no window, no sound.

[sdl]
output=surface
autolock=false

[dosbox]
memsize=16
machine=svga_s3

[render]
frameskip=0

[mixer]
nosound=true

[speaker]
pcspeaker=false
disney=false
tandy=off

[cpu]
core=auto
cputype=auto
cycles=max

[autoexec]
# mounts and build commands are passed via -c on the command line
